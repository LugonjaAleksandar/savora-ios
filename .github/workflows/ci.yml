name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Pick an iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name']))")
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          xcodebuild test \
            -project Savora.xcodeproj \
            -scheme Savora \
            -destination "id=$DEVICE_ID" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
